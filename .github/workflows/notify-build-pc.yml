# Tells a build PC that main changed, so it builds the APK (scripts/BUILD-PC.md). Runs on GitHub's machines and only
# sends a signal: nothing is built here, no game data is involved. Without the repository variable BUILD_REPO (the
# private repository whose self-hosted runner builds) and the secret BUILD_DISPATCH_TOKEN, it does nothing.
name: Notify the build PC

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions: {}

jobs:
  notify:
    if: ${{ vars.BUILD_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send the new commit to the build PC
        env:
          GH_TOKEN: ${{ secrets.BUILD_DISPATCH_TOKEN }}
          BUILD_REPO: ${{ vars.BUILD_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No BUILD_DISPATCH_TOKEN secret: nothing sent"; exit 0; fi
          gh api "repos/$BUILD_REPO/dispatches" -f event_type=ph-push -f "client_payload[sha]=$GITHUB_SHA"
          echo "Sent $GITHUB_SHA to $BUILD_REPO"
